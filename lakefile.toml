[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.0"

[[lean_lib]]
name = "Star"
globs = ["Star.Bluespec.Basic", "Star.Bluespec.Lib.BluespecPrelude", "Star.Bluespec.Lib.BluespecVerification"]

[[lean_lib]]
name = "SecurityPolicy"

[[lean_lib]]
name = "NFI"

[[lean_lib]]
name = "Multiplier"

[[lean_lib]]
name = "Multiplier_sandbox"

[[lean_lib]]
name = "Multiplier_mechanization"
